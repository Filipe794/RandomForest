# =============================================================================
# R7 - Juntar tudo e conferir (ablação)
# -----------------------------------------------------------------------------
# Pergunta: os vencedores das rodadas anteriores funcionam juntos, e cada um
#           ainda é necessário?
# Objetivo: o baseline é a combinação de todos os vencedores. Cada experimento
#           tira UM deles (volta ao valor do R1). Se tirar um elemento não piora
#           significativamente, ele sai (regra da mais simples).
# Critério: o da rodada que decidiu cada ponto: roc_auc (R1-R4, R6) e F1 ou
#           balanced_accuracy com recall >= 0.70 (R5).
#   python compare.py --rodada R7_ --ref <vencedor do R6> --salvar
#   (--ref: compara cada ablação com a combinação completa, não com a de maior média)
#
# Atualizado: R1 100 árvores; R2 sqrt; R3 max_depth 4 / min_samples_leaf 10;
#             R4 mediana sem flags; R5 class_weight balanced; R6 sem variáveis.
# Experimentos cujo elemento já é o padrão no baseline ficam iguais ao baseline
# e são pulados pelo hash.
# =============================================================================

baseline_name: R7_baseline

baseline:
  zeros: to_nan                               # vencedor de R4
  missing_flags: none                         # vencedor de R4
  imputer: median                             # vencedor de R4
  features: none                              # vencedor de R6
  selection: none
  balancing: none                             # vencedor de R5 (peso de classe, sem subamostragem)
  model: {name: random_forest, n_estimators: 100, max_features: sqrt, max_depth: 4, min_samples_leaf: 10, class_weight: balanced}  # vencedores de R1, R2, R3 e R5

experiments:
  # Sem as colunas de flag (R4) — já é o baseline, será pulado
  - name: R7_sem_flags
    override: {missing_flags: none}

  # Com a imputação do R1 (mediana) — já é o baseline, será pulado
  - name: R7_imputer_mediana
    override: {imputer: median}

  # Sem variáveis derivadas (R6) — já é o baseline, será pulado
  - name: R7_sem_variaveis
    override: {features: none}

  # Sem subamostragem (R5) — já é o baseline, será pulado
  - name: R7_sem_subamostragem
    override: {balancing: none}

  # Sem ajuste de limiar (R5) — já é o baseline
  - name: R7_sem_limiar
    override: {threshold: none}

  # Sem peso de classe (R5): model do baseline SEM o class_weight
  - name: R7_sem_peso
    override:
      model: {name: random_forest, n_estimators: 100, max_features: sqrt, max_depth: 4, min_samples_leaf: 10}  # baseline sem class_weight

  # Com as árvores completas do padrão (R3): model do baseline SEM max_depth/min_samples_leaf
  - name: R7_arvores_completas
    override:
      model: {name: random_forest, n_estimators: 100, max_features: sqrt, class_weight: balanced}  # baseline sem max_depth/min_samples_leaf