# =============================================================================
# R8 - Calibração das probabilidades
# -----------------------------------------------------------------------------
# Pergunta: as probabilidades da floresta podem ser lidas como risco real?
#           ("72% de risco" = de cada 100 pacientes assim, ~72 diabéticas)
#   sigmoid   curva logística (método de Platt); mais segura com poucos dados
#   isotonic  função em degraus; mais flexível, pode sobreajustar com ~430
#             pacientes por fold
# A calibração usa um CV interno só no treino e mantém UMA floresta (as mesmas
# árvores). Os dois mudam o Brier e o log loss. Efeito no roc_auc:
#   sigmoid   a ordem das pacientes não muda, o roc_auc fica IGUAL;
#   isotonic  pode empatar pacientes no mesmo degrau e mudar o roc_auc
#             (em geral, um pouco para baixo). Confira o roc_auc das isotonic.
# Critério: brier (menor é melhor). Entre as sem diferença significativa, a mais
#           simples: sem calibração -> sigmoid -> isotonic.
#   python compare.py --rodada R8_ --metric brier --incluir <vencedor do R7> --salvar
#
# Atualizado: baseline = vencedor do R7
#   (20261029_133225_eae571_R5_pesos__class_weight=balanced).
# O baseline é pulado pelo hash: a referência no compare.py é essa pasta.
# =============================================================================

baseline_name: R8_baseline

baseline:
  zeros: to_nan                               # vencedor de R7
  missing_flags: none                         # vencedor de R7
  imputer: median                             # vencedor de R7
  features: none                              # vencedor de R7
  selection: none
  balancing: none                             # vencedor de R7
  model: {name: random_forest, n_estimators: 100, max_features: sqrt, max_depth: 4, min_samples_leaf: 10, class_weight: balanced}  # vencedor de R7

experiments:
  - name: R8_calibracao
    override: {calibration: sigmoid}
    sweep:
      calibration.name: [sigmoid, isotonic]

  # Candidata do R5: limiar F1, sem peso, com a calibração vencedora
  - name: R8_cand_limiar
    override:
      calibration: sigmoid
      model: {name: random_forest, n_estimators: 100, max_features: sqrt, max_depth: 4, min_samples_leaf: 10}
      threshold: {name: tuned, scoring: f1}

  # Peso de classe + limiar F1, com a calibração vencedora
  - name: R8_cand_peso_limiar
    override:
      calibration: sigmoid
      model: {name: random_forest, n_estimators: 100, max_features: sqrt, max_depth: 4, min_samples_leaf: 10, class_weight: balanced}
      threshold: {name: tuned, scoring: f1}